<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="4" y1="2" x2="28" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="radarSweep" x1="16" y1="4" x2="28" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="planeGrad" x1="16" y1="8" x2="16" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
  </defs>

  <!-- Background Base Badge -->
  <rect width="32" height="32" rx="7" fill="#070d18" stroke="#1e293b" stroke-width="1" />

  <!-- Outer Radar Pulse Arc -->
  <path d="M 6 16 A 10 10 0 0 1 26 16" stroke="url(#radarSweep)" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 3" opacity="0.6" />

  <!-- Inner Signal Guard Ring -->
  <circle cx="16" cy="16" r="11.5" stroke="#0284c7" stroke-width="1.2" opacity="0.4" />

  <!-- Dynamic Radar Sweep Beam Arc -->
  <path d="M 16 5 A 11 11 0 0 1 27 16" stroke="url(#radarSweep)" stroke-width="2" stroke-linecap="round" />

  <!-- Geometric Aircraft Silhouette (Crisp, modern, vector-aligned) -->
  <path d="M 16 8 L 18 13 L 24.5 16.5 L 24.5 18 L 18 16.5 L 18 21.5 L 20 23 L 20 24 L 16 23.2 L 12 24 L 12 23 L 14 21.5 L 14 16.5 L 7.5 18 L 7.5 16.5 L 14 13 Z" 
        fill="url(#planeGrad)" 
        stroke="#0284c7" 
        stroke-width="0.5" 
        stroke-linejoin="round" />

  <!-- Trust Verification Signal Dot -->
  <circle cx="16" cy="8" r="1.2" fill="#10b981" />
</svg>