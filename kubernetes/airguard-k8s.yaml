apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airguard-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airguard-db
  template:
    metadata:
      labels:
        app: airguard-db
    spec:
      containers:
        - name: db
          image: postgres:15-alpine
          env:
            - name: POSTGRES_DB
              value: airguard
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgrespassword123
          ports:
            - containerPort: 5432
          resources:
            limits:
              cpu: "0.5"
              memory: 512Mi
            requests:
              cpu: "0.2"
              memory: 256Mi
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: airguard-db-service
spec:
  selector:
    app: airguard-db
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airguard-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airguard-redis
  template:
    metadata:
      labels:
        app: airguard-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            limits:
              cpu: "0.25"
              memory: 256Mi
            requests:
              cpu: "0.1"
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: airguard-redis-service
spec:
  selector:
    app: airguard-redis
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airguard-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: airguard-api
  template:
    metadata:
      labels:
        app: airguard-api
    spec:
      containers:
        - name: api
          image: airguard-backend:latest
          env:
            - name: ENV
              value: prod
            - name: DATABASE_URL
              value: postgresql+asyncpg://postgres:postgrespassword123@airguard-db-service:5432/airguard
            - name: REDIS_URL
              value: redis://airguard-redis-service:6379/0
            - name: SECRET_KEY
              value: PRODUCTION_SECURE_OVERRIDE_KEY_XYZ_987!
            - name: JAEGER_HOST
              value: jaeger-service
            - name: RUN_INGESTION
              value: "false"
          ports:
            - containerPort: 8001
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            limits:
              cpu: "1.0"
              memory: 1024Mi
            requests:
              cpu: "0.5"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: airguard-api-service
spec:
  selector:
    app: airguard-api
  ports:
    - protocol: TCP
      port: 8001
      targetPort: 8001
  type: LoadBalancer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airguard-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: airguard-worker
  template:
    metadata:
      labels:
        app: airguard-worker
    spec:
      containers:
        - name: worker
          image: airguard-backend:latest
          command: ["python", "app/worker.py"]
          env:
            - name: ENV
              value: prod
            - name: DATABASE_URL
              value: postgresql+asyncpg://postgres:postgrespassword123@airguard-db-service:5432/airguard
            - name: REDIS_URL
              value: redis://airguard-redis-service:6379/0
            - name: JAEGER_HOST
              value: jaeger-service
          resources:
            limits:
              cpu: "1.0"
              memory: 1024Mi
            requests:
              cpu: "0.5"
              memory: 512Mi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: airguard-worker-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: airguard-worker
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: External
      external:
        metric:
          name: airguard_queue_depth
        target:
          type: Value
          value: 100
