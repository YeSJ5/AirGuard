version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: airguard_db_prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-airguard}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} # Must be provided from cloud/external secrets manager
    # No ports exposed to host to block database accessibility from outside the internal network
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-airguard}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    restart: always

  redis:
    image: redis:7-alpine
    container_name: airguard_redis_prod
    # No ports exposed to host to secure queue and session cache broker
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    restart: always

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: airguard_jaeger_prod
    ports:
      - "16686:16686"
      # OTLP collector port 4317 is kept internal to the compose network
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    restart: always

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: airguard_prometheus_prod
    volumes:
      - ./prometheus:/etc/prometheus
    # 9090 is kept internal to secure analytics log targets
    depends_on:
      - api
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    restart: always

  grafana:
    image: grafana/grafana:10.4.2
    container_name: airguard_grafana_prod
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    restart: always

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    environment:
      - ENV=prod # Enables fail-fast checks
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-airguard}
      - REDIS_URL=redis://redis:6379/0
      - JAEGER_HOST=jaeger
      - LOG_LEVEL=WARNING # Production log level restriction
      - RUN_INGESTION=true
      - OPENSKY_USERNAME=${OPENSKY_USERNAME:-}
      - OPENSKY_PASSWORD=${OPENSKY_PASSWORD:-}
      - OPENSKY_GLOBAL_VIEW=true
    ports:
      - "8001:8001"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8001 --workers 1"
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  detection_worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    environment:
      - ENV=prod # Enables fail-fast checks
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-airguard}
      - REDIS_URL=redis://redis:6379/0
      - JAEGER_HOST=jaeger
      - LOG_LEVEL=WARNING
    command: python app/worker.py
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: airguard_frontend_prod
    ports:
      - "80:80" # Exposed production HTTP port
    depends_on:
      - api
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    restart: always

volumes:
  pgdata_prod:
